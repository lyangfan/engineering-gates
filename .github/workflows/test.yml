name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure
        run: python3 /Users/liuyangfan/.codex/skills/.system/skill-creator/scripts/quick_validate.py .
      - name: Run unit tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
